name: Test and Release

# Cancel superseded runs on the same ref instead of piling them up
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      # The default branch of this repository is "master". The workflow used to
      # listen on "main" only, so it never ran for a single push.
      - "*"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          type-checking: true
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Current supported lines; node 26 is required by the ioBroker checks.
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true

# Deploys the final package to NPM on version tags.
# Disabled until you opt in: set the repository variable NPM_DEPLOY_ENABLED=true
# (Settings -> Secrets and variables -> Actions -> Variables) after creating the
# NPM_TOKEN secret. Nothing fails on tags while it is switched off.
  deploy:
    needs: [check-and-lint, adapter-tests]
    if: |
      vars.NPM_DEPLOY_ENABLED == 'true' &&
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '22.x'
          build: true
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
